 "00103": {
   overview:"'Introduction to Hand Tools' has three real Learning Objectives: common hand tools like hammers and wrenches, measurement/layout tools, and other shop/job-site tools like saws and clamps. There's one combined Performance Task covering all three objectives \u2014 you inspect and demonstrate the safe, proper use of essentially every tool covered in the module, so this is tested hands-on as much as it's tested by exam question.",
   deepDive:[
     {h:"Hammers, Chisels, Screwdrivers & Wrenches", p:"The exam likes testing tool mix-ups here: a pipe wrench has toothed, self-tightening jaws made to bite into round pipe, while an adjustable (crescent) wrench has smooth jaws sized to flat-sided fasteners \u2014 using one where the other belongs either slips or damages the fastener. This objective also covers various types of pliers and their uses (slip-joint pliers adjust to grip a range of small objects but don't lock tightly, unlike locking pliers).",
      facts:[
        "Hammer types: claw hammer (drives/pulls nails), ball-peen hammer (metalwork/shaping, not for nails), sledgehammer (heavy demolition), rubber mallet (won't mar the surface being struck).",
        "Demolition tools: pry bar/wrecking bar (leverage for prying material apart), bull point and flat chisel for concrete/masonry breaking.",
        "Screwdriver tip types: flathead (slotted), Phillips (cross/X pattern), Torx (star pattern), Robertson (square) \u2014 using the wrong tip strips the fastener head.",
        "Wrench types: non-adjustable/combination (fixed size, one end open, one end box/closed), adjustable/crescent (movable jaw, smooth for flat-sided fasteners), socket wrench (interchangeable sockets with a ratcheting handle for speed)."
      ]},
     {h:"Measurement & Layout Tools", p:"A level checks both level (horizontal) and plumb (vertical) alignment. A framing square isn't just 'a ruler' \u2014 its whole purpose is laying out and verifying 90\u00b0 angles, which ties directly into Module 00102's math content on the Pythagorean theorem and the 3-4-5 method. Other layout tools like plumb bobs and chalk lines let you transfer a straight or vertical reference line across a distance without a straightedge long enough to span it.",
      facts:[
        "A carpenter's level typically has 3 vials: one for level (horizontal), one for plumb (vertical), and sometimes a 45\u00b0 vial for angled work.",
        "A framing square's two arms are called the body (longer, ~24\") and the tongue (shorter, ~16\") \u2014 used together for laying out rafters, stairs, and right angles.",
        "A chalk line snaps a straight reference line across distances too long for a straightedge; a plumb bob establishes a true vertical line using gravity and a weighted point."
      ]},
     {h:"Handsaws, Clamps, Files & Earth Tools", p:"Handsaws differ by application \u2014 a hacksaw's fine teeth are built for metal, not wood, while a crosscut saw and rip saw are cut for wood grain in opposite directions. Clamps hold material steady while cutting, gluing, or fastening. Files and utility knives shape or trim material by hand, and earth tools split the job by shape: a round-point shovel for general digging, a spade for edging, and a pick for breaking up hard or rocky ground first.",
      facts:[
        "Handsaw types: crosscut saw (cuts across the wood grain), rip saw (cuts along/with the grain), hacksaw (fine teeth for metal/plastic), coping saw (tight curves/detail cuts).",
        "Clamp types: C-clamp (general holding), bar/pipe clamp (long reach for glue-ups), spring clamp (quick, light-duty hold), locking (vise-grip style) clamp.",
        "Earth tools: round-point shovel (general digging), spade (flat blade, edging/cutting sod), pick (breaking hard/rocky ground before digging)."
      ]}
   ],
   objectives:[
     "LO1: Identify hammers/demolition tools, chisels/punches, screwdrivers (matched to hardware), wrenches, and pliers.",
     "LO2: Identify measurement tools plus levels and layout tools (framing square, plumb bob, chalk line) and their uses.",
     "LO3: Differentiate handsaws by application, identify clamp designs, and describe files/utility knives/shovels/picks.",
     "Explain pre-use inspection: check for cracks, mushroomed striking heads, loose handles, dull/damaged edges.",
     "Explain why a damaged hand tool must be removed from service immediately rather than used cautiously."
   ],
   terms:[
     {t:"Claw hammer", d:"Drives nails (face) and pulls nails (curved claw)."},
     {t:"Cat's paw", d:"Pulling bar for nails set flush/below the surface."},
     {t:"Level", d:"Checks horizontal (level) or vertical (plumb) alignment."},
     {t:"Chisel", d:"Cuts/shapes wood or metal, usually struck with a mallet."},
     {t:"Framing square", d:"An L-shaped tool for laying out and checking right angles, often used in framing and stair layout."},
     {t:"Pipe wrench", d:"A wrench with toothed, self-tightening jaws made specifically to grip and turn round pipe."},
     {t:"Mushroomed head", d:"A flattened, splayed striking surface on a hammer or chisel caused by repeated impact \u2014 a rejection criterion since fragments can chip off."},
     {t:"Hacksaw", d:"A fine-toothed hand saw used to cut metal, plastic, or other hard materials."},
     {t:"Plumb bob", d:"A weighted point on a string used to establish a true vertical reference line."},
     {t:"Chalk line", d:"A reel of chalk-coated string snapped against a surface to mark a straight reference line."}
   ],
   examTips:["Exam questions often describe a task and ask 'which tool' \u2014 know the tool's PRIMARY purpose, not just its name.","There's one combined Performance Task across all 3 LOs \u2014 expect hands-on inspection/use questions, not just definitions."],
   safety:[
     "OSHA 29 CFR 1926.300(a): hand tools must be maintained in a safe condition regardless of who owns them.",
     "OSHA 29 CFR 1926.301: employers may not issue or permit use of unsafe hand tools; damaged tools must be removed from service."
   ],
   formulas:["Pre-use checklist: 1) select the right tool 2) inspect for cracks/mushroomed heads/loose handles 3) wear required PPE 4) use it as designed (pull wrenches, cut away from your body) 5) clean, oil, and store properly 6) pull damaged tools from service immediately."]
 },
 "00104": {
   overview:"'Introduction to Power Tools' has four real Learning Objectives: drills and impact wrenches, power saws, grinders and oscillating multi-tools, and miscellaneous power tools like nailers and hydraulic jacks. There's one combined Performance Task covering all four \u2014 safely and properly demonstrating the use of a long list of specific tools (drill, hammer drill, impact driver, circular saw, jigsaw, reciprocating saw, band saw, miter/cutoff saw, table saw, grinder, oscillating multi-tool, power nailer). This is also flagged as the first module where trainees handle energized tools and equipment, so safety habits formed here are treated as setting the tone for every power-tool module afterward.",
   deepDive:[
     {h:"Drills & Impact Wrenches", p:"The 'switch off before connecting power or changing bits' habit matters here specifically: some drills can begin spinning the instant they get power if the trigger was left engaged, which is exactly how fingers get caught while a bit is being swapped.",
      facts:[
        "Drill bit types: twist bit (general wood/metal), spade bit (fast rough wood boring), hole saw (large-diameter holes), masonry bit (carbide tip for concrete/brick).",
        "Hammer drill = linear hammering action + rotation, for masonry/concrete. Impact driver = rotational impacts (no hammering), for driving fasteners fast without stripping them.",
        "Pneumatic (air-powered) drills/impact wrenches need a compressor and hose, are generally lighter than corded equivalents, but add hose-whip and connection hazards."
      ]},
     {h:"Power Saws", p:"Kickback gets particular attention on circular saws \u2014 it happens when the blade binds in the material, throwing the saw back toward the operator, which is why the blade guard's job is limiting exposure and should never be wedged open. Reciprocating saws get flagged for demolition work specifically because cuts are often made 'blind' through a wall or floor, risking contact with hidden wiring, plumbing, or gas lines.",
      facts:[
        "Circular saw blade tooth count: fewer teeth (24T) = faster, rougher rip cuts; more teeth (60T+) = slower, smoother finish/crosscuts.",
        "Jigsaw = fine, curved, detail cuts on a stationary workpiece. Reciprocating saw = rough, fast cuts, often used in demolition and can cut 'blind' through walls.",
        "Miter saw = angled cross-cuts (for trim, framing angles). Cutoff saw (chop saw) = straight cuts through metal or masonry using an abrasive wheel.",
        "Table saw kickback guard, riving knife, and push sticks are the three key safety features \u2014 never remove the riving knife/guard, and never place hands in line with the blade."
      ]},
     {h:"Grinders & Oscillating Multi-Tools", p:"Various types of grinders (angle grinders for cutting/grinding metal, bench grinders for sharpening, detail grinders for fine work) and their accessories (different wheel/disc types for different materials and tasks), plus the range of jobs an oscillating multi-tool can perform \u2014 it's a versatile tool that can cut, sand, scrape, and grind depending on the attachment used, which makes it common for detail work in tight spaces.",
      facts:[
        "Angle grinder discs: cutting wheel (thin, for cutting metal/masonry), grinding wheel (thicker, for smoothing/removing material), wire wheel (rust/paint removal), flap disc (finishing).",
        "Bench grinders are stationary and typically used for sharpening tools or removing burrs \u2014 always keep the tool rest adjusted close (within 1/8 inch) to the wheel.",
        "Oscillating multi-tool attachments include straight blades (plunge cuts), segment blades (flush cuts), sanding pads, and scrapers \u2014 the tool oscillates rather than spins, which is why it's safer for detail work near existing surfaces."
      ]},
     {h:"Power Nailers & Hydraulic Jacks", p:"The specific hazards of using power nailers (accidental discharge is the main risk, which is why trigger-safety mechanisms matter and why nailers should never be pointed at another person, even 'as a joke') and the types of jobs hydraulic jacks are used for (lifting heavy loads using pressurized fluid, common in leveling, positioning, or supporting structures during repair work).",
      facts:[
        "Power nailer safety mechanisms: sequential trip trigger (safest \u2014 requires nose contact + trigger pull, in that order) vs. contact/bump trigger (fires on contact alone, higher risk of double-fires).",
        "Never carry a pneumatic nailer with your finger on the trigger, and always disconnect the air supply before clearing a jam.",
        "Hydraulic jacks are rated by tonnage capacity (e.g., 2-ton, 10-ton) \u2014 exceeding rated capacity risks seal failure and sudden load drop."
      ]}
   ],
   objectives:[
     "LO1: Identify power drills, bits, hammer drills vs. impact drivers, and pneumatic drills/impact wrenches.",
     "LO2: Explain the use of circular saws, jigsaws, reciprocating saws, band saws, miter/cutoff saws, and table saws.",
     "LO3: Describe jobs suited to grinders (and their accessories) and oscillating multi-tools.",
     "LO4: Discuss power nailer hazards and jobs performed with hydraulic jacks.",
     "Explain why a tool's guard should never be removed or defeated, even temporarily.",
     "Recognize demolition hazards \u2014 reciprocating saws used 'blind' can strike hidden utilities."
   ],
   terms:[
     {t:"Kickback", d:"Sudden backward thrust of a saw toward the operator."},
     {t:"Pneumatic tool", d:"Powered by compressed air."},
     {t:"Hydraulic tool", d:"Powered by pressurized fluid."},
     {t:"Chuck", d:"The clamping mechanism that holds a drill bit."},
     {t:"Blade guard", d:"A movable shield covering a saw blade to prevent accidental contact."},
     {t:"Air hose whip", d:"An uncontrolled, whipping movement of a pressurized air hose if it disconnects unexpectedly."},
     {t:"Impact driver", d:"Delivers rotational impacts for driving fasteners; distinct from a hammer drill's linear hammering action for masonry."},
     {t:"Oscillating multi-tool", d:"A versatile tool that cuts, sands, scrapes, or grinds depending on the attachment used."}
   ],
   examTips:["Know the 'before you...' safety sequences (disconnect power before changing bits/blades, check switch off before plugging in).","This is the first module with energized tools \u2014 expect PPE-matching questions (face shield for grinders, eye protection for saws/drills)."],
   safety:[
     "OSHA 29 CFR 1926 Subpart I (\u00a71926.300\u2013305): power tool guarding, safe operation, and maintenance requirements.",
     "OSHA 29 CFR 1926.302: specific rules for power-operated hand tools (pneumatic, fuel-powered, hydraulic).",
     "OSHA 29 CFR 1926.303: abrasive wheel/grinder guarding and work-rest adjustment rules."
   ],
   formulas:["Safety sequence: disconnect the power source before changing bits/blades \u2192 confirm the switch is OFF before connecting power \u2192 confirm the blade guard is functional before cutting."]
 },
 "00105": {
   overview:"'Introduction to Construction Drawings' technically has just one Learning Objective, but it breaks into five real subparts (a\u2013e): the six basic drawing components, drawing elements like lines/symbols/grid lines, how dimensions relate to scale, using engineer's and architect's scales, and the six types of construction drawings. The module includes an actual oversize residential drawing set as an appendix, and the single Performance Task has you use that real drawing set to locate a specific wall, calculate the home's overall width, find a distance between two features, determine an eave overhang, and use an architect's scale to find the garage width \u2014 so this is tested as an applied skill on a real drawing, not abstract definitions.",
   deepDive:[
     {h:"The Six Basic Drawing Components", p:"Every construction drawing set is built from six basic components: a way of showing what the finished project should look like and how it's put together (the drawing itself), together with things like a legend of symbols, a title block, dimensions, notes, and schedules that all support reading it correctly. Learning to recognize these six components on any drawing \u2014 rather than any one specific building's drawing set \u2014 is what makes you able to read a set you've never seen before, which is exactly the situation you'll be in on a real job site.",
      facts:[
        "The 6 components: (1) the drawing/graphic itself, (2) title block, (3) legend/symbols key, (4) dimensions, (5) notes (general and specific), (6) schedules (tables of repeated items like doors/windows).",
        "Title blocks are almost always in the bottom-right corner and include: project name, address, scale, date, drawn-by, and revision history."
      ]},
     {h:"Drawing Elements: Lines, Symbols & Grid Lines", p:"Lines of construction carry real meaning: a solid line is something you'd actually see if you were standing there (an edge, a wall, a visible corner), while a dashed line represents something hidden \u2014 a beam inside a wall, a pipe beneath a slab. Symbols stand in for real objects (doors, windows, electrical outlets, plumbing fixtures) so the drawing doesn't need to draw every item literally, and a legend is the key that tells you what each symbol means on that specific drawing set. Grid lines create a coordinate system (often lettered on one axis and numbered on the other) so you can reference an exact location on the drawing \u2014 like 'column line C-4' \u2014 without needing to describe it in words.",
      facts:[
        "Common line types: object/solid line (visible edge), hidden/dashed line (concealed feature), centerline (long-short-long dashes, marks symmetry), dimension line (with arrows, shows a measured distance), leader line (points from a note to a specific feature).",
        "Grid lines typically run letters (A, B, C\u2026) on one axis and numbers (1, 2, 3\u2026) on the other, so a location like 'C-4' pinpoints an exact column or intersection."
      ]},
     {h:"Dimensions & Reading a Scale", p:"Dimensions relate to the drawing's scale, and reading that correctly is a skill you have to practice, not just memorize. If a drawing is marked \u00bc\" = 1'-0\", every \u00bc inch on the page represents 1 real foot on the actual building. So a wall measuring 2 inches on paper is 2 \u00f7 \u00bc = 8, meaning 8 feet in real life. An architect's scale is a triangular ruler with multiple scales built in specifically for this conversion, while an engineer's scale uses a different system (typically decimal-based, like 1\" = 10', 20', etc.) more common on civil/site drawings. Knowing which scale tool matches which drawing type, and being able to convert in both directions \u2014 paper distance to real distance and back \u2014 is what the exam and the Performance Task both actually test.",
      facts:[
        "Common architectural scales: 1/8\"=1'-0\" (whole buildings/site plans), 1/4\"=1'-0\" (floor plans), 3/8\"=1'-0\" and 1/2\"=1'-0\" (larger floor plans), 3/4\"=1'-0\" to 1\"=1'-0\" (detail drawings).",
        "Common engineer's scales: 1\"=10', 1\"=20', 1\"=30', 1\"=40', 1\"=50', 1\"=100' \u2014 decimal-based, typically used for site/civil plans covering large areas.",
        "An architect's scale has 11 different scales on one triangular ruler (2 per edge, one shared); an engineer's scale has 6 decimal scales, one per edge."
      ]},
     {h:"The Six Types of Construction Drawings", p:"Six distinct types of construction drawings, each showing a different aspect of the same project: plan views (top-down, like a floor plan), elevations (straight-on exterior or interior views), section views (a sliced-through view revealing interior construction detail), detail drawings (an enlarged, close-up view of one specific assembly), and additional drawing types covering site/civil information and specialty systems (like MEP \u2014 mechanical, electrical, plumbing). Recognizing which type you're looking at tells you what kind of information to expect from it before you even start reading the details.",
      facts:[
        "The 6 drawing types: plan view, elevation, section view, detail drawing, schedule, and site/plot plan.",
        "A site/plot plan shows the building's location on the property, property lines, setbacks, and often utility connection points \u2014 it's usually the first sheet in a full set."
      ]}
   ],
   objectives:[
     "Summarize the six basic components used in every construction drawing set.",
     "Explain drawing elements: lines of construction, symbols, and grid lines, and how a legend ties them together.",
     "Explain how dimensions relate to a drawing's scale.",
     "Use an engineer's scale and an architect's scale to read real-world dimensions off a scaled drawing.",
     "Identify the six types of construction drawings (plan, elevation, section, detail, and others)."
   ],
   terms:[
     {t:"Plan view", d:"Top-down view, like a floor plan."},
     {t:"Elevation", d:"Straight-on vertical exterior/interior view."},
     {t:"Section view", d:"Sliced-through view showing interior detail."},
     {t:"Title block", d:"Info panel (bottom-right) with project name, scale, date, revisions."},
     {t:"MEP", d:"Mechanical, Electrical, Plumbing drawings."},
     {t:"Legend", d:"A key explaining the symbols, line types, and abbreviations used on a drawing."},
     {t:"Detail drawing", d:"An enlarged, close-up view of one specific part of an assembly."},
     {t:"Architect's scale", d:"A triangular ruler with multiple fractional-inch-per-foot scales used to read dimensions off a scaled drawing."},
     {t:"Engineer's scale", d:"A decimal-based scale (1\"=10', 20', etc.), more common on civil/site drawings than architectural ones."},
     {t:"Grid lines", d:"A lettered/numbered coordinate system on a drawing used to reference an exact location (e.g., column line C-4)."}
   ],
   examTips:["The Performance Task uses a real residential drawing set \u2014 practice locating specific walls/dimensions on an actual plan, not just definitions.","Know when to use an architect's scale vs. an engineer's scale \u2014 the exam tests telling these apart."],
   safety:["No dedicated OSHA standard governs reading drawings, but ANSI Y14 drafting conventions standardize the symbols, line types, and scale notation used industry-wide."],
   formulas:["Reading an architect's scale: a drawing marked \u00bc\" = 1'-0\" means every \u00bc inch on the page equals 1 real-world foot \u2014 align the drawing edge to the matching scale line and read the foot marks directly."]
 },
 "00106": {
   overview:"'Introduction to Basic Rigging' is an elective module with a single Learning Objective that breaks into five real subparts (a\u2013e): sling types, sling inspection, rigging hardware and its inspection, types of hoists, and rigging hitches plus the Emergency Stop hand signal. Note that no certification or competency level is awarded for this module \u2014 it's explicitly for familiarization only. The two Performance Tasks are demonstrating the proper ASME Emergency Stop hand signal, and demonstrating the ability to report a sling's load capacity or identify that it's too damaged to use.",
   deepDive:[
     {h:"Types of Slings", p:"Three sling types: synthetic (web or round), alloy steel chain, and wire rope. Each has different strengths \u2014 synthetic slings are lighter and less likely to damage a load's finish, chain slings handle heat and abrasion well, and wire rope offers high strength for heavy loads \u2014 and picking the right one for the job and load type is part of what this subpart tests.",
      facts:[
        "Synthetic slings: lightest, best for finished/delicate surfaces, but weakest against heat, chemicals, and UV degradation over time.",
        "Alloy steel chain slings: best for hot, abrasive, or sharp-edged loads (foundries, rough metal); each link is individually rated and inspectable.",
        "Wire rope slings: highest strength-to-weight for very heavy loads, but least flexible and can develop internal damage ('birdcaging') that's hard to see from outside."
      ]},
     {h:"Sling Inspection", p:"Inspection criteria exist because sling failure is often invisible until it happens. A synthetic sling with internal fiber damage can look fine on the surface, which is why manufacturers build in a 'tattle-tail' indicator strip that visibly pulls in if the sling has been overloaded. Wire rope shows damage differently: 'birdcaging' (strands separating and bulging outward) signals the internal core has shifted or failed. Any sling showing cuts, fraying, chemical burns, or these structural signs gets pulled from service immediately \u2014 there's no 'still mostly fine' exception in rigging, because failure during a lift means a load coming down on whoever's underneath. This ties directly to one of the module's Performance Tasks: reporting a sling's capacity, or reporting that it's too damaged to use.",
      facts:[
        "Synthetic sling rejection signs: cuts, snags, punctures, broken/worn stitching, chemical/UV discoloration, a pulled-in tattle-tail indicator.",
        "Chain sling rejection signs: any bent/stretched link, nicks or gouges, cracks, or evidence of heat damage (bluish discoloration).",
        "Wire rope rejection signs: birdcaging, kinks, crushed sections, broken wires (a set number per lay length triggers rejection), corrosion."
      ]},
     {h:"Rigging Hardware & Inspection", p:"Beyond slings, hardware like shackles, eyebolts, lifting clamps, and hooks \u2014 identifying each and knowing how to inspect it for damage (bent shackles, deformed eyebolts, cracked hooks) before trusting it with a load. Damaged hardware follows the same rule as damaged slings: pulled from service immediately, not used cautiously.",
      facts:[
        "Shackle types: anchor/bow shackle (wider bow, handles angled loads) vs. chain/D-shackle (narrower, for in-line pulls).",
        "Always check that a shackle pin is fully seated and the correct pin for that shackle (mismatched pins are a common rejection cause).",
        "Hook inspection checks for: throat opening (widening beyond spec = rejection), any visible crack, and a functioning safety latch."
      ]},
     {h:"Types of Hoists", p:"Knowing what each type is suited for (and its limitations) is part of basic rigging familiarization, even though this module doesn't certify you to operate any of them.",
      facts:[
        "Chain hoist (chain fall): hand-operated, mechanical advantage via gearing, common for shop/field lifts with no power source nearby.",
        "Come-along (ratchet puller): hand-operated, mainly for horizontal pulling, NOT rated for vertical overhead lifting.",
        "Electric/powered hoists: motor-driven, used for repeated or heavier lifts where speed and consistency matter."
      ]},
     {h:"Rigging Hitches & the Emergency Stop Signal", p:"Also, the ASME Emergency Stop hand signal specifically \u2014 one of the module's two Performance Tasks has you demonstrate it \u2014 and the key exam trap: ANY worker who spots a hazard during a lift can and should give the Emergency Stop signal, not only the designated signal person.",
      facts:[
        "Sling angle capacity loss (approximate, from horizontal): 90\u00b0 (vertical) = 100% capacity, 60\u00b0 = ~87%, 45\u00b0 = ~71%, 30\u00b0 = ~50%. Below 30\u00b0, capacity drops sharply \u2014 most riggers avoid angles under 45\u00b0.",
        "ASME Emergency Stop hand signal: both arms extended out to the sides, palms down, moving horizontally back and forth \u2014 any worker can give it, and the operator must obey immediately.",
        "A choker hitch's capacity is typically rated at about 75% of the sling's vertical (straight) rating due to the added stress at the choke point."
      ]}
   ],
   objectives:[
     "Identify the three sling types (synthetic, alloy steel chain, wire rope) and how to inspect each for damage.",
     "Identify and inspect common rigging hardware (shackles, eyebolts, lifting clamps, hooks).",
     "Identify various types of hoists used in rigging.",
     "Identify rigging hitches (vertical, choker, basket) and demonstrate the ASME Emergency Stop hand signal.",
     "Explain how a sling's rated capacity changes as its leg angle from horizontal decreases."
   ],
   terms:[
     {t:"Choker hitch", d:"Sling wraps the load and passes through its own eye, tightening under load."},
     {t:"Basket hitch", d:"Sling passes under the load, both ends on the hook \u2014 can double rated capacity."},
     {t:"Vertical hitch", d:"Sling runs straight from the hook to the load with no wrap \u2014 gives the sling's full rated single-leg capacity."},
     {t:"Come-along", d:"Hand-operated ratchet hoist for horizontal pulls only, never vertical lifting."},
     {t:"Tattle-tail", d:"A pulled-in indicator on a synthetic sling showing it may have been overloaded and must be rejected."},
     {t:"Shackle", d:"A connector used to join a sling to a load or to other rigging hardware."},
     {t:"Working load limit (WLL)", d:"The maximum load a piece of rigging equipment is rated to safely lift."}
   ],
   examTips:["Emergency Stop signal authority is a favorite trick question \u2014 remember it's NOT limited to the designated signal person."],
   safety:[
     "OSHA 29 CFR 1926 Subpart CC (\u00a71926.1400\u20131442): cranes and derricks in construction, including rigging and signal-person requirements.",
     "OSHA 29 CFR 1926.251: rigging equipment for material handling \u2014 inspection and rejection criteria for slings and hardware."
   ],
   formulas:[
     "A basket hitch can rate up to 2\u00d7 the sling's single-leg vertical capacity when rigged symmetrically.",
     "As the angle between a sling leg and the horizontal decreases, its effective lifting capacity decreases \u2014 always check the manufacturer's rated angle chart."
   ]
 },
 "00107": {
   overview:"'Basic Communication Skills' has two real Learning Objectives: the communication/listening/speaking processes, and reading/writing skills, both tied directly to job performance. There are three Performance Tasks: performing a task after listening to oral instructions, filling out a work-related form, and reading a set of instructions for donning a safety harness before orally instructing someone else on how to do it \u2014 so this module is tested as an applied communication chain (receive \u2192 understand \u2192 relay), not just vocabulary.",
   deepDive:[
     {h:"Communication, Listening & Speaking", p:"Every communication has the same basic anatomy: a sender, a message, a channel, a receiver, and feedback that confirms the message landed correctly. Job-site miscommunication usually traces back to a break in one of those links \u2014 noise garbling the channel, jargon the receiver doesn't share, or no feedback loop closing the gap, so nobody catches the misunderstanding until the wrong thing gets built. Active listening is the receiver's half of that fix: repeating back instructions or asking a clarifying question before acting, rather than nodding along and hoping it was clear.",
      facts:[
        "The 5 parts of the communication process: sender \u2192 message \u2192 channel \u2192 receiver \u2192 feedback.",
        "Active listening techniques: paraphrase back what you heard, ask clarifying questions, avoid interrupting, maintain eye contact/attention, don't plan your response while the other person is still talking.",
        "Common speaking-clarity mistakes: using jargon the listener doesn't know, giving too many steps at once, not confirming the listener understood before walking away."
      ]},
     {h:"Reading & Writing on the Job", p:"Written communication earns its own emphasis because it solves a specific weakness of verbal communication: memory. A verbal instruction for a simple task is usually fine, but a complex one \u2014 multiple steps, specific measurements, sequencing that matters \u2014 is far more reliably followed when it's also written down, since it gives both sides something to check against later. This objective is tested with real applied tasks: filling out an actual work-related form, and reading a manufacturer's harness-donning instructions well enough to correctly instruct someone else how to do it \u2014 meaning you have to understand the reading well enough to translate it into clear spoken instructions.",
      facts:[
        "Common job-related reading materials: SDS (Safety Data Sheets), manufacturer's instructions, work orders, punch lists, construction drawings.",
        "Common job-related writing tasks: incident/accident reports, daily logs, material requisition forms, timesheets \u2014 all of which typically become permanent project records."
      ]}
   ],
   objectives:[
     "LO1: Describe the communication process and identify good listening and speaking skills.",
     "LO2: Describe good reading and writing skills and their relationship to job performance.",
     "Identify common communication barriers (noise, jargon, distraction, assumptions).",
     "Recognize nonverbal communication (body language, tone, facial expression) and its impact."
   ],
   terms:[
     {t:"Active listening", d:"Fully concentrating on and understanding a speaker."},
     {t:"Communication barrier", d:"Anything that blocks a message from being understood."},
     {t:"Feedback", d:"Confirms a message was received/understood correctly."},
     {t:"Nonverbal communication", d:"Body language, facial expressions, gestures, and tone that convey meaning beyond words."},
     {t:"Jargon", d:"Technical or trade-specific terms that can confuse a listener unfamiliar with them."}
   ],
   examTips:["Expect an applied task-chain question: listen/read \u2192 understand \u2192 relay \u2014 not just a vocabulary definition.","Know both LO1 (listening/speaking) and LO2 (reading/writing) separately \u2014 the exam splits these two objectives."],
   safety:[],
   formulas:[]
 },
 "00108": {
   overview:"'Basic Employability Skills' has three real Learning Objectives: opportunities in construction and how to enter the workforce, critical thinking and problem-solving, and social skills/conflict resolution/teamwork. It's a knowledge-only module with no Performance Tasks, so the exam focus stays conceptual \u2014 why each professional habit matters \u2014 rather than a physical demonstration.",
   deepDive:[
     {h:"Construction Business & Entering the Workforce", p:"A resume or application in this field should highlight relevant skills, certifications, and safety training, since that's what tells an employer you understand what actually matters on a job site.",
      facts:[
        "Entry paths recap: direct hire (start working immediately, employer-led training), registered apprenticeship (structured, leads to journey-level), pre-apprenticeship (builds basics first).",
        "A construction resume should lead with: safety certifications (like this Core credential), relevant tool/equipment experience, and any completed training modules \u2014 ahead of unrelated job history."
      ]},
     {h:"Critical Thinking & Problem-Solving", p:"Critical thinking has common barriers that get in the way of solving problems \u2014 jumping to conclusions, tunnel vision, and not gathering enough information first are the big three. Solving a problem for real follows a sequence: define the problem, gather information, weigh options, choose and act, then evaluate the result. Planning and scheduling problems fit here too, since construction work is sequenced and a scheduling problem in one place often cascades into delays elsewhere.",
      facts:[
        "5-step problem-solving process: (1) define the problem, (2) gather information, (3) weigh/compare options, (4) choose and act, (5) evaluate the result.",
        "Common problem-solving barriers: jumping to conclusions before gathering facts, tunnel vision (fixating on one solution), groupthink (going along with the group instead of raising a real concern)."
      ]},
     {h:"Social Skills, Conflict & Teamwork", p:"Good personal and social skills matter as much as trade skill on a crew. Resolving conflict with co-workers or supervisors means addressing the actual problem calmly and directly, not the person, and not letting it build up or escalating immediately. Giving and receiving constructive criticism works best when it's specific, focused on behavior or work rather than the person, and delivered with the intent to help. Workplace social issues of concern \u2014 harassment, discrimination, and similar conduct issues \u2014 fall here too, along with working in a team environment and being an effective leader, since a crew depends on every assigned person showing up and pulling their weight. That's why attendance and attitude often decide who stays employed more than raw skill does early on.",
      facts:[
        "Constructive criticism format: describe the specific behavior/work, explain the impact, suggest a specific improvement \u2014 avoid vague or personal statements.",
        "Workplace social issues covered: harassment, discrimination, bullying \u2014 most companies require these to be reported to a supervisor or HR, not handled informally.",
        "Effective team leadership traits: clear communication, leading by example, giving credit to the team, and addressing problems directly rather than avoiding them."
      ]}
   ],
   objectives:[
     "LO1: Describe construction business opportunities and how to enter the construction workforce.",
     "LO2: Describe critical thinking, common problem-solving barriers, and planning/scheduling problems.",
     "LO3: Identify social skills, conflict resolution, giving/receiving constructive criticism, workplace social issues, and teamwork/leadership.",
     "Explain why substance-abuse awareness is part of employability in a hazardous industry."
   ],
   terms:[
     {t:"Employability skills", d:"Soft skills (attitude, reliability, teamwork) employers look for beyond trade skill."},
     {t:"Conflict resolution", d:"Calmly and constructively resolving disagreements."},
     {t:"Dependability", d:"Consistently showing up and following through on assigned tasks, which builds employer trust."},
     {t:"Critical thinking", d:"Objectively analyzing a problem \u2014 gathering information and weighing options \u2014 before deciding how to act."},
     {t:"Constructive criticism", d:"Specific, behavior-focused feedback delivered with the intent to help someone improve."}
   ],
   examTips:["No performance test on this module \u2014 knowledge-test only, so focus on WHY each trait/practice matters to an employer.","LO2 (critical thinking/problem-solving) is often under-studied \u2014 know the basic problem-solving steps, not just LO3's social skills."],
   safety:[],
   formulas:[]
 },
 "00109": {
   overview:"'Introduction to Material Handling' has two real Learning Objectives: basic material handling concepts/safety precautions (which includes knot tying, often overlooked), and material handling equipment (non-motorized and motorized). The two Performance Tasks are demonstrating safe manual lifting technique, and tying two of four common knots \u2014 square, bowline, half hitch, or clove hitch \u2014 so knot tying is a real tested skill here, not a side note.",
   deepDive:[
     {h:"Manual Lifting, Safety Precautions & Knot Tying", p:"The lifting technique isn't an arbitrary checklist: your lower back is strong in compression but weak against combined bending-and-twisting loads, which is exactly the motion that causes disc injuries. Bending at the knees instead of the waist keeps your spine neutral while your legs do the actual work; keeping the load close reduces the leverage working against your back; and twisting while carrying combines the load with a rotational force your spine isn't built to resist under load, which is why you turn with your feet instead. On the knot side, a square knot joins two ropes of similar diameter, a bowline forms a fixed loop that won't slip or bind under load, a half hitch is a quick, simple wrap used to secure a rope to an object, and a clove hitch grips a post or rail and resists slipping along its length \u2014 you're expected to actually tie at least two of these, not just describe them.",
      facts:[
        "Safe lifting steps, in order: (1) plan the lift/check the weight, (2) feet shoulder-width apart, (3) bend at the knees, (4) keep the load close, (5) keep back straight, (6) lift with your legs, (7) never twist \u2014 pivot with your feet instead.",
        "Square knot: joins two ropes of similar diameter (also used for bandaging) \u2014 remember 'right over left, left over right.'",
        "Bowline: forms a fixed loop that won't slip or tighten under load \u2014 commonly used for rescue or securing a line to an anchor point.",
        "Clove hitch: quick to tie/untie, grips a post or rail well, but can slip under a shifting or specific-direction load \u2014 best for temporary securing, not critical loads.",
        "Half hitch: simplest knot, usually used in combination with another knot (like two half hitches) for extra security."
      ]},
     {h:"Material Handling Equipment", p:"Rated capacity on any of this equipment isn't a suggestion \u2014 it's the tested, certified limit for that specific piece of equipment, and exceeding it risks structural failure of the equipment itself, not just dropping the load. This objective also covers the 'fall zone' \u2014 the area beneath a raised or suspended load that must stay clear of workers, since a shifting load doesn't give warning before it moves \u2014 and cross-key stacking, a technique for interlocking layers of lumber, brick, or pipe at alternating angles so a stored stack behaves like one connected unit instead of a pile that can topple.",
      facts:[
        "Non-motorized equipment: hand truck (2-wheeled, for boxes/appliances), dolly (flat, 4-wheeled platform), pallet jack (manual hydraulic lift for pallets).",
        "Motorized equipment: standard forklift (warehouse/paved surfaces), rough-terrain forklift (deep-tread tires for unpaved sites), telehandler (extending boom forklift for reaching height/distance).",
        "A forklift's data/capacity plate is required to be posted on the machine and lists its maximum rated load at a specific load center (commonly 24 inches) \u2014 loads carried further from that center reduce the safe capacity."
      ]}
   ],
   objectives:[
     "LO1: Describe manual lifting concepts, material handling safety precautions, and tie common knots (square, bowline, half hitch, clove hitch).",
     "LO2: Identify non-motorized and motorized material handling equipment and how each is used.",
     "Explain what a 'fall zone' is and why it must be kept clear under a suspended load.",
     "Describe cross-key stacking for stable material storage (lumber, brick, pipe).",
     "Explain why a forklift's rated capacity must never be exceeded."
   ],
   terms:[
     {t:"Fall zone", d:"Area beneath a raised/suspended load that must stay clear of workers."},
     {t:"Cross-key stacking", d:"Interlocking layers at an angle to improve stack stability."},
     {t:"Rough terrain forklift", d:"Forklift with deep-tread tires for uneven/unpaved ground."},
     {t:"Rated capacity", d:"The maximum load material handling equipment is certified to safely carry; it must never be exceeded."},
     {t:"Hand truck", d:"A wheeled device for moving boxes or materials without excessive manual lifting."},
     {t:"Bowline", d:"A knot that forms a fixed loop that won't slip or bind, even under load."},
     {t:"Clove hitch", d:"A knot that grips a post or rail and resists slipping along its length."},
     {t:"Square knot", d:"A knot used to join two ropes of similar diameter."}
   ],
   examTips:["Don't skip knot tying \u2014 it's one of only two Performance Tasks in this module (square, bowline, half hitch, clove hitch).","Lifting technique and fall-zone awareness are the concepts most likely to be tested on the knowledge side."],
   safety:[
     "OSHA 29 CFR 1926 Subpart H (\u00a71926.250\u2013251): general requirements for storage, stacking height limits, and rigging equipment used in materials handling.",

var RANKS = [
  {name:"Trainee", minXP:0, icon:"\uD83E\uDDBA", stage:0},
  {name:"Helper", minXP:120, icon:"\uD83D\uDC77", stage:1},
  {name:"Apprentice", minXP:350, icon:"\uD83E\uDD34", stage:2},
  {name:"Journey-Worker", minXP:800, icon:"\uD83D\uDD27", stage:3},
  {name:"Foreman", minXP:1500, icon:"\uD83D\uDCCB", stage:4},
  {name:"Superintendent", minXP:2400, icon:"\uD83C\uDFD7\uFE0F", stage:5}
];
function rankForXP(xp){
  var r = RANKS[0];
  for (var i=0;i<RANKS.length;i++){ if (xp >= RANKS[i].minXP) r = RANKS[i]; }
  return r;
}
function nextRank(xp){
  for (var i=0;i<RANKS.length;i++){ if (RANKS[i].minXP > xp) return RANKS[i]; }
  return null;
}

 {module:"00101", setup:"A coworker is about to step onto a scaffold with an unreadable inspection tag. Your supervisor is on a call 50 feet away.", q:"What's the most appropriate immediate action?", choices:["Wait for the supervisor to finish the call before saying anything","Warn the coworker immediately and prevent access until the scaffold is verified safe","Assume the tag was left over from testing and allow access","Only mention it during the next toolbox talk"], a:1, explain:"Anyone who spots a hazard should act immediately \u2014 waiting risks an injury in the meantime."},

 {module:"00101", setup:"You're assigned to enter a space large enough to work in, with a restricted entrance, not designed for continuous occupancy.", q:"Before entry, what's required regardless of how the space looks?", choices:["Nothing extra if it looks clean","Atmospheric testing (oxygen, combustibles, toxics) and an entry permit","Just a hard hat","Permission from a coworker"], a:1, explain:"A space can look completely normal and still have unsafe air \u2014 testing and a permit are required regardless of appearance."},

 {module:"00101", setup:"A trench for a utility line reaches 6 feet deep in soil that isn't stable rock.", q:"What's required before a worker enters?", choices:["Nothing since it's under 10 feet","A protective system such as shoring, shielding, or sloping","A spotter only","A harness tied to the trench wall"], a:1, explain:"Trenches 5 feet or deeper generally require a protective system unless the excavation is entirely in stable rock."},
 {module:"00101", setup:"You inspect your fall-arrest harness and find frayed webbing on one strap, though the D-ring and stitching look fine.", q:"What's the correct action?", choices:["Use it since most of it is fine","Remove it from service immediately \u2014 any single rejection sign means the whole harness is rejected","Use it only for tasks under 6 feet","Tape over the frayed section and continue using it"], a:1, explain:"One rejection sign is enough \u2014 frayed webbing alone means the whole harness comes out of service."},

 {module:"00103", setup:"You inspect a chisel before use and find the striking end has flattened and started to splay outward with thin edges.", q:"What's the correct action?", choices:["Continue using it carefully since the cutting edge is still sharp","Remove it from service immediately \u2014 a mushroomed striking end can shear off fragments when struck","File the mushroomed edge flat and keep using it","Use it only for light-duty tasks"], a:1, explain:"A mushroomed striking end is a rejection criterion \u2014 it can chip off sharp fragments under impact."},

function shuffle(arr){
  var a = arr.slice();
  for (var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; });
}
function highlightFacts(s){
  var marked = String(s).replace(/(\d+-\d+-\d+|\d+\/\d+|\d[\d,]*(?:\.\d+)?%?|\u00bc|\u00bd|\u00be)/g, function(m){ return "\u0001"+m+"\u0002"; });
  var escaped = escapeHtml(marked);
  return escaped.replace(/\u0001/g, '<span class="hl-num">').replace(/\u0002/g, '</span>');
}
var SECTION_COLORS = ["var(--orange)","var(--green)","var(--blue)","var(--purple)","var(--pink)","var(--teal)","var(--amber)","var(--lime)"];

var state = {
  tab: "dashboard",
  module: "ALL",
  guideModule: null,
  cameFromReference: true,
  cardProgress: {},
  quizStats: {},
  sectionDone: {},
  guideOpenSection: {},
  notes: [],
  noteDraftText: "",
  noteDraftModule: "GENERAL",
  game: {
    xp: 0, reputation: 70, streak: 0, lastShiftDate: null,
    shiftsCompleted: 0, hadPerfectShift: false, moduleCorrect: {}, badges: []
  },
  shift: null,
  cardOrder: [],
  cardPos: 0,
  flipped: false,
  quizOrder: [],
  quizPos: 0,
  quizSelected: null,
  quizAnswered: false,
  sessionScore: {correct:0,total:0}
};

function loadState(){
  try{
    var raw = localStorage.getItem("nccerCoreProgress_v1");
    if (raw){
      var d = JSON.parse(raw);
      state.cardProgress = d.cardProgress || {};
      state.quizStats = d.quizStats || {};
      state.sectionDone = d.sectionDone || {};
      state.notes = d.notes || [];
      if (d.game){ state.game = Object.assign({xp:0,reputation:70,streak:0,lastShiftDate:null,shiftsCompleted:0,hadPerfectShift:false,moduleCorrect:{},badges:[]}, d.game); }
    }
  }catch(e){}
}
function saveState(){
  try{ localStorage.setItem("nccerCoreProgress_v1", JSON.stringify({cardProgress: state.cardProgress, quizStats: state.quizStats, sectionDone: state.sectionDone, notes: state.notes, game: state.game})); }catch(e){}
}

function filteredCards(){
  if (state.module==="ALL") return FLASHCARDS.map(function(c,i){ return {c:c, idx:i}; });
  var out=[]; for (var i=0;i<FLASHCARDS.length;i++){ if (FLASHCARDS[i].module===state.module) out.push({c:FLASHCARDS[i], idx:i}); }
  return out;
}
function filteredQuiz(){
  if (state.module==="ALL") return QUIZ.map(function(q,i){ return {q:q, idx:i}; });
  var out=[]; for (var i=0;i<QUIZ.length;i++){ if (QUIZ[i].module===state.module) out.push({q:QUIZ[i], idx:i}); }
  return out;
}
function resetCardOrder(){ var f = filteredCards(); state.cardOrder = shuffle(f.map(function(x,i){return i;})); state.cardPos = 0; state.flipped = false; }
function resetQuizOrder(){ var f = filteredQuiz(); state.quizOrder = shuffle(f.map(function(x,i){return i;})); state.quizPos = 0; state.quizSelected = null; state.quizAnswered = false; state.sessionScore = {correct:0,total:0}; }

var navDepth = 0;
function navSnapshot(){ return {tab: state.tab, module: state.module, guideModule: state.guideModule}; }
function pushNav(){
  navDepth++;
  try{ history.pushState(navSnapshot(), ""); }catch(e){}
}
function applySnapshot(snap){
  state.tab = snap.tab; state.module = snap.module; state.guideModule = snap.guideModule;
  if (state.tab==="flashcards") resetCardOrder();
  if (state.tab==="quiz") resetQuizOrder();
}

function setTab(tab){
  state.tab = tab;
  state.guideModule = null;
  if (tab==="flashcards") resetCardOrder();
  if (tab==="quiz") resetQuizOrder();
  render();
}
function setModule(m){
  state.module = m;
  if (state.tab==="flashcards") resetCardOrder();
  if (state.tab==="quiz") resetQuizOrder();
  render();
}
function openGuide(id){
  state.guideModule = id;
  pushNav();
  render();
  window.scrollTo && window.scrollTo(0,0); document.getElementById("content").scrollTop = 0;
}
function goBack(){
  if (navDepth > 0){
    try{ history.back(); return; }catch(e){}
  }
  state.guideModule = null; render();
}
function studyModuleCards(id){ state.tab="flashcards"; state.module=id; state.guideModule=null; resetCardOrder(); pushNav(); render(); }
function quizModule(id){ state.tab="quiz"; state.module=id; state.guideModule=null; resetQuizOrder(); pushNav(); render(); }

function toggleGuideSection(moduleId, idx){
  var cur = state.guideOpenSection[moduleId];
  state.guideOpenSection[moduleId] = (cur === idx) ? -1 : idx;
  render();
}
function toggleSectionDone(moduleId, idx, ev){
  if (ev && ev.stopPropagation) ev.stopPropagation();
  var key = moduleId + "_" + idx;
  state.sectionDone[key] = !state.sectionDone[key];
  saveState();
  render();
}

function flipCard(){ state.flipped = !state.flipped; render(); }
function nextCard(){ var f = filteredCards(); if (!f.length) return; state.flipped=false; state.cardPos = (state.cardPos+1) % f.length; render(); }
function prevCard(){ var f = filteredCards(); if (!f.length) return; state.flipped=false; state.cardPos = (state.cardPos-1+f.length) % f.length; render(); }
function markCard(status){
  var f = filteredCards(); if (!f.length) return;
  var item = f[state.cardOrder[state.cardPos % f.length]];
  state.cardProgress[item.idx] = status; saveState(); nextCard();
  showToast(status==="known" ? "Marked as known \u2705" : "Added to review pile \uD83D\uDD01");
}
function chooseAnswer(choiceIdx){
  if (state.quizAnswered) return;
  var f = filteredQuiz(); if (!f.length) return;
  var item = f[state.quizOrder[state.quizPos % f.length]];
  state.quizSelected = choiceIdx; state.quizAnswered = true;
  var correct = choiceIdx === item.q.a;
  state.sessionScore.total++; if (correct) state.sessionScore.correct++;
  var cur = state.quizStats[item.q.module] || {correct:0,total:0};
  cur.total++; if (correct) cur.correct++;
  state.quizStats[item.q.module] = cur; saveState(); render();
}
function nextQuestion(){
  var f = filteredQuiz(); if (!f.length) return;
  state.quizSelected = null; state.quizAnswered = false; state.quizPos = (state.quizPos+1) % f.length; render();
}
function resetProgress(){
  if (!confirm("Reset all flashcard and quiz progress? This can't be undone.")) return;
  state.cardProgress = {}; state.quizStats = {}; state.sectionDone = {}; saveState(); render(); showToast("Progress reset");
}
function exportProgress(){
  var data = JSON.stringify({cardProgress: state.cardProgress, quizStats: state.quizStats, sectionDone: state.sectionDone, notes: state.notes, game: state.game, exportedAt: new Date().toISOString()}, null, 2);
  try{
    var blob = new Blob([data], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a"); a.href = url; a.download = "nccer-core-progress.json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    showToast("Progress exported");
  }catch(e){ showToast("Export not supported here"); }
}
function triggerImport(){ document.getElementById("importFile").click(); }
function importProgress(file){
  var reader = new FileReader();
  reader.onload = function(ev){
    try{
      var d = JSON.parse(ev.target.result);
      state.cardProgress = d.cardProgress || {}; state.quizStats = d.quizStats || {};
      state.sectionDone = d.sectionDone || {}; state.notes = d.notes || state.notes;
      if (d.game) state.game = Object.assign(state.game, d.game);
      saveState(); render(); showToast("Progress imported");
    }catch(e){ showToast("Couldn't read that file"); }
  };
  reader.readAsText(file);
}
function showToast(msg){
  var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(window.__toastTimer); window.__toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 1800);
}

function ring(pct, colorVar){
  var deg = Math.round(pct*360);
  return '<div class="ring" style="background:conic-gradient('+colorVar+' '+deg+'deg,var(--surface-2) '+deg+'deg)"><div class="ring-inner">'+Math.round(pct*100)+'%</div></div>';
}

function siteSceneSVG(stage){

      s += '<rect x="'+x+'" y="60" width="6" height="52" fill="#c9a15a"/>';

    s += '<rect x="95" y="65" width="110" height="47" fill="#d8dee6"/>';

// ---------- Job Site Career Sim logic ----------
function todayStr(){ var d = new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function yesterdayStr(){ var d = new Date(); d.setDate(d.getDate()-1); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }

function buildShiftTasks(){
  var tasks = [];
  // 3 from real quiz bank (reframed), 2 from narrative site events
  var quizPicks = shuffle(QUIZ.map(function(x,i){return i;})).slice(0,3);
  quizPicks.forEach(function(i){
    var q = QUIZ[i];
    tasks.push({module:q.module, setup:"Foreman needs this checked before the crew moves on.", q:q.q, choices:q.choices, a:q.a, explain:q.explain, xp:12, source:"quiz"});
  });
  var eventPicks = shuffle(SITE_EVENTS.map(function(x,i){return i;})).slice(0,2);
  eventPicks.forEach(function(i){
    var e = SITE_EVENTS[i];
    tasks.push({module:e.module, setup:e.setup, q:e.q, choices:e.choices, a:e.a, explain:e.explain, xp:18, source:"event"});
  });
  return shuffle(tasks);
}

function clockIn(){
  state.shift = {
    tasks: buildShiftTasks(), pos: 0, selected: null, answered: false,
    correctCount: 0, xpEarned: 0, introLine: pmLine("intro"), newBadges: []
  };
  render();
}
function submitShiftTaskAnswer(choiceIdx){
  var sh = state.shift; if (!sh || sh.answered) return;
  var task = sh.tasks[sh.pos];
  sh.selected = choiceIdx; sh.answered = true;
  var correct = (choiceIdx === task.a);
  if (correct){
    sh.correctCount++; sh.xpEarned += task.xp;
    state.game.moduleCorrect[task.module] = (state.game.moduleCorrect[task.module]||0) + 1;
    sh.reaction = pmLine("correct");
  } else {
    sh.reaction = pmLine("wrong");
  }
  render();
}
function nextShiftTask(){
  var sh = state.shift; if (!sh) return;
  if (sh.pos < sh.tasks.length - 1){
    sh.pos++; sh.selected = null; sh.answered = false; sh.reaction = null;
    render();
  } else {
    finishShift();
  }
}
function finishShift(){
  var sh = state.shift; if (!sh) return;
  var g = state.game;
  var prevRank = rankForXP(g.xp).name;
  g.xp += sh.xpEarned;
  var pct = sh.tasks.length ? sh.correctCount / sh.tasks.length : 0;
  g.reputation = Math.max(0, Math.min(100, g.reputation + Math.round((pct-0.6)*20)));
  if (pct === 1) g.hadPerfectShift = true;
  g.shiftsCompleted++;

  var today = todayStr();
  if (g.lastShiftDate === yesterdayStr()) g.streak++;
  else if (g.lastShiftDate !== today) g.streak = 1;
  g.lastShiftDate = today;

  var newRank = rankForXP(g.xp).name;
  var rankedUp = (newRank !== prevRank);

  var newBadges = [];
  BADGES.forEach(function(b){
    if (g.badges.indexOf(b.id) === -1 && b.check(g)){
      g.badges.push(b.id); newBadges.push(b);
    }
  });

  sh.done = true; sh.rankedUp = rankedUp; sh.newRank = newRank; sh.newBadges = newBadges;
  sh.summaryLine = pct >= 0.8 ? pmLine("shiftEndGood") : (pct >= 0.4 ? pmLine("shiftEndMixed") : pmLine("shiftEndRough"));
  saveState();
  render();
}
function clockOut(){ state.shift = null; render(); }

  var d = new Date(ts);
  var opts = {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"};
  try{ return d.toLocaleDateString(undefined, opts); }catch(e){ return d.toDateString(); }
}

  html += '<div class="notes-composer">';
  html += '<div class="notes-mod-row">';
  html += '<div class="chip'+(state.noteDraftModule==="GENERAL"?" active":"")+'" onclick="App.setNoteDraftModule(\'GENERAL\')">General</div>';
  MODULES.forEach(function(m){
    html += '<div class="chip'+(state.noteDraftModule===m.id?" active":"")+'" onclick="App.setNoteDraftModule(\''+m.id+'\')">'+m.id+'</div>';
  });
  html += '</div>';
  html += '<textarea id="noteInput" class="notes-textarea" placeholder="Jot down something from class..." oninput="App.updateNoteDraft(this.value)">'+escapeHtml(state.noteDraftText)+'</textarea>';
  html += '<button class="btn btn-wide btn-primary" onclick="App.addNote()">\uD83D\uDCBE Save Note</button>';
  html += '</div>';

  if (!state.notes.length){
    html += '<div class="notes-empty">\uD83D\uDCDD No notes yet. Anything you jot down here \u2014 during class, a toolbox talk, or while studying \u2014 gets saved right on this device.</div>';
    return html;
  }

  html += '<div class="section-title">'+state.notes.length+' saved note'+(state.notes.length===1?"":"s")+'</div>';
  state.notes.forEach(function(n){
    var m = (n.module && n.module!=="GENERAL") ? modInfo(n.module) : null;
    html += '<div class="note-card">';
    html += '<div class="note-card-top">';
    html += '<span class="note-tag" style="'+(m?('background:'+m.color+'22;color:'+m.color):'')+'">'+(m ? (m.id+' \u00b7 '+escapeHtml(m.title)) : 'General')+'</span>';
    html += '<button class="note-del" onclick="App.deleteNote(\''+n.id+'\')">\u2715</button>';
    html += '</div>';
    html += '<div class="note-text">'+escapeHtml(n.text).replace(/\n/g,'<br>')+'</div>';
    html += '<div class="note-date">'+formatNoteDate(n.ts)+'</div>';
    html += '</div>';
  });
  return html;
}

var APPBAR = {
  dashboard: ["NCCER Core Study", "Intro to Basic Construction Skills \u00b7 6th Ed.", "\uD83D\uDC77"],
  flashcards: ["Flashcards", "Tap a card to flip it", "\uD83D\uDDC2\uFE0F"],
  quiz: ["Practice Quiz", "Modeled on the Core Level Test", "\uD83D\uDCDD"],
  reference: ["Study Guide", "Tap a module for key notes", "\uD83D\uDCD6"],
  notes: ["My Notes", "Your own notes, saved on this device", "\uD83D\uDCDD"]
};

function render(){
  var showBack = navDepth > 0;
  document.getElementById("backBtn").style.display = showBack ? "inline-block" : "none";
  document.getElementById("appbarHat").style.display = showBack ? "none" : "block";
  if (state.tab==="reference" && state.guideModule){
    var m = modInfo(state.guideModule);
    document.getElementById("appbarTitle").textContent = m.id + " Study Guide";
    document.getElementById("appbarSub").textContent = m.title;
  } else {
    document.getElementById("appbarTitle").textContent = APPBAR[state.tab][0];
    document.getElementById("appbarSub").textContent = APPBAR[state.tab][1];
    document.getElementById("appbarHat").textContent = APPBAR[state.tab][2];
  }

  var contentHtml = "";
  if (state.tab==="dashboard") contentHtml = renderDashboard();
  else if (state.tab==="flashcards") contentHtml = renderFlashcards();
  else if (state.tab==="quiz") contentHtml = renderQuiz();
  else if (state.tab==="notes") contentHtml = renderNotes();
  else contentHtml = renderReference();
  document.getElementById("content").innerHTML = contentHtml;

  var navs = [
    {id:"dashboard", label:"Home", icon:ICONS.home},
    {id:"flashcards", label:"Cards", icon:ICONS.cards},
    {id:"quiz", label:"Quiz", icon:ICONS.quiz},
    {id:"reference", label:"Study Guide", icon:ICONS.book},
    {id:"notes", label:"Notes", icon:ICONS.notes}
  ];
  var navHtml = "";
  navs.forEach(function(n){
    navHtml += '<button class="navbtn'+(state.tab===n.id?" active":"")+'" onclick="App.setTab(\''+n.id+'\')"><svg viewBox="0 0 24 24">'+n.icon+'</svg>'+n.label+'</button>';
  });
  document.getElementById("bottomnav").innerHTML = navHtml;
}

window.App = {
  setTab: setTab, setModule: setModule, openGuide: openGuide, goBack: goBack,
  studyModuleCards: studyModuleCards, quizModule: quizModule,
  flipCard: flipCard, nextCard: nextCard, prevCard: prevCard, markCard: markCard,
  chooseAnswer: chooseAnswer, nextQuestion: nextQuestion,
  exportProgress: exportProgress, triggerImport: triggerImport, resetProgress: resetProgress,
  toggleGuideSection: toggleGuideSection, toggleSectionDone: toggleSectionDone,
  addNote: addNote, deleteNote: deleteNote, updateNoteDraft: updateNoteDraft, setNoteDraftModule: setNoteDraftModule,
  clockIn: clockIn, submitShiftTaskAnswer: submitShiftTaskAnswer, nextShiftTask: nextShiftTask, clockOut: clockOut
};

document.getElementById("importFile").addEventListener("change", function(e){
  if (e.target.files[0]) importProgress(e.target.files[0]);
  e.target.value = "";
});

window.addEventListener("popstate", function(e){
  navDepth = Math.max(0, navDepth - 1);
  if (e.state){
    applySnapshot(e.state);
  } else {
    state.tab = "dashboard"; state.guideModule = null;
  }
  render();
});

loadState();
resetCardOrder();
resetQuizOrder();
try{ history.replaceState(navSnapshot(), ""); }catch(e){}
render();
})();
</script>
<script data-cochat-helper="true">
// Dark mode sync from parent
window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'darkMode') {
        document.documentElement.classList.toggle('dark', e.data.dark);
    }
});

// CoChat helpers — bridge to the parent window for authenticated calls.
// The artifact iframe has no ``allow-same-origin``, so localStorage and
// direct same-origin fetches with auth do not work here. The parent
// attaches the user's token, picks a model (preferring the active chat's
// selection over a platform default), and proxies to an allow-listed
// endpoint. If your caller wants to pin a specific model id, set
// ``window._cochatModel = '<model-id>'`` before invoking ``cochat.ask``.
(function() {
    var _pending = {};
    var _seq = 0;
    var _BRIDGE_TIMEOUT_MS = 30000;

    function _newRequestId() {
        _seq += 1;
        return 'cochat-' + Date.now().toString(36) + '-' + _seq.toString(36);
    }

    window.addEventListener('message', function(e) {
        var data = e.data;
        if (!data || data.type !== 'cochat:bridge:response') return;
        var pending = _pending[data.requestId];
        if (!pending) return;
        delete _pending[data.requestId];
        clearTimeout(pending.timer);
        if (data.error) {
            pending.reject(new Error(data.error));
        } else {
            pending.resolve(data);
        }
    });

    function _bridge(message) {
        return new Promise(function(resolve, reject) {
            if (!window.parent || window.parent === window) {
                reject(new Error('CoChat bridge unavailable: no parent window'));
                return;
            }
            var requestId = _newRequestId();
            var timer = setTimeout(function() {
                if (_pending[requestId]) {
                    delete _pending[requestId];
                    reject(new Error('CoChat bridge timed out after 30s'));
                }
            }, _BRIDGE_TIMEOUT_MS);
            _pending[requestId] = { resolve: resolve, reject: reject, timer: timer };
            try {
                window.parent.postMessage(
                    Object.assign({ requestId: requestId }, message),
                    '*'
                );
            } catch (err) {
                delete _pending[requestId];
                clearTimeout(timer);
                reject(err);
            }
        });
    }

    window.cochat = {
        // Call the LLM. The parent attaches auth and uses the current chat's model.
        // Usage: const reply = await cochat.ask("What is 2+2?", {system: "..."});
        ask: async function(prompt, options) {
            options = options || {};
            var model = (options && options.model) || window._cochatModel || '';
            var resp = await _bridge({
                type: 'cochat:ask',
                prompt: prompt,
                system: options.system || '',
                model: model
            });
            if (resp && typeof resp.content === 'string') return resp.content;
            return '';
        },

        // Proxied external HTTP call. Goes through /api/proxy parent-side.
        // Usage: const r = await cochat.fetch({method:'GET', url:'https://api.example.com/x'});
        fetch: async function(opts) {
            opts = opts || {};
            var resp = await _bridge({
                type: 'cochat:proxy',
                method: opts.method || 'GET',
                url: opts.url || '',
                headers: opts.headers || {},
                body: typeof opts.body === 'string' ? opts.body : (opts.body == null ? '' : JSON.stringify(opts.body))
            });
            return {
                ok: !!resp.ok,
                status: resp.status || 0,
                headers: resp.headers || {},
                body: resp.body || '',
                json: function() {
                    try { return JSON.parse(resp.body || ''); } catch (e) { return null; }
                }
            };
        }
    };
})();
</script>
